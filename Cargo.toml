[package]
name = "sea-orm-typed-id"
version = "0.6.2"
edition = "2021"
authors = ["Rene Klacan <rene@klacan.sk>"]
license = "MIT"
description = "A Rust library that provides a macro for generating type-safe database ID types for SeaORM."
repository = "https://github.com/reneklacan/sea-orm-typed-id"

[lib]
doctest = false

[dependencies]
sea-orm = { version = "2", default-features = false, features = [
  "macros",
  "postgres-array",
  "with-json",
] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
schemars = { version = "^1.0", optional = true }
utoipa = { version = ">=4.0", optional = true }

[features]
default = []
all = ["schema", "utoipa"]
schema = ["dep:schemars"]
utoipa = ["dep:utoipa"]
